name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_CLASS_CODE: ${{ secrets.VITE_CLASS_CODE }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          if [ -z "$VITE_CLASS_CODE" ]; then export VITE_CLASS_CODE=Oge_Monolog_012; fi
          npm run build

      - name: Verify production bundle
        run: |
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'dist/index.html still references dev entry — build failed'
            exit 1
          fi
          test -f dist/assets/*.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
